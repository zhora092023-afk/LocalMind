- id: "MYPY-001"
  date: "2026-08-29"
  module: "build_system"
  error_message: "Source file found twice under different module names"
  context: "Запуск mypy --strict из корня проекта с in-place структурой папок"
  root_cause: "Mypy не знал, как интерпретировать пространства имён. Файл app/domain/schemas.py был виден и как domain.schemas, и как app.domain.schemas."
  solution: "Добавить в mypy.ini опции namespace_packages = True и explicit_package_bases = True, а также прописать mypy_path = ."
  verification: "Команда mypy --explicit-package-bases app/ --strict теперь выполняется без ошибок"
  assigned_to: "Архитектор"
  tags: ["mypy", "imports", "strict_mode"]

- id: "MYPY-002"
  date: "2026-08-29"
  module: "build_system"
  error_message: "No [mypy] section in config file"
  context: "Попытка использовать TOML-синтаксис в INI-файле mypy.ini"
  root_cause: "Файл mypy.ini должен строго соответствовать INI-формату, без квадратных скобок для переопределений модулей."
  solution: "Использовать чистый INI-формат без [[...]] секций. Для переопределений модулей используется синтаксис [mypy-имя_модуля.*]."
  verification: "mypy --explicit-package-bases app/ --strict проходит без ошибок"
  assigned_to: "Архитектор"
  tags: ["mypy", "config", "ini"]

- id: "MYPY-003"
  date: "2026-08-29"
  module: "build_system"
  error_message: "Type statement is only supported in Python 3.12 and greater"
  context: "mypy пытался проверить файл numpy/__init__.pyi, который использует синтаксис Python 3.12"
  root_cause: "mypy по умолчанию следует за всеми импортами, включая установленные библиотеки"
  solution: "Добавить в mypy.ini настройку follow_imports = skip для глобальной секции и включить нормальное следование только для app.* через переопределение"
  verification: "mypy app/domain/schemas.py app/interfaces.py app/core/config.py app/main.py --ignore-missing-imports завершается успешно"
  assigned_to: "Архитектор"
  tags: ["mypy", "imports", "numpy", "follow_imports"]

- id: "MYPY-004"
  date: "2026-08-29"
  module: "build_system"
  error_message: "UnicodeDecodeError: 'charmap' codec can't decode byte 0x98"
  context: "Постоянные ошибки при чтении mypy.ini из-за невидимых символов в кодировке cp1251 на Windows"
  root_cause: "Windows-система с кодировкой cp1251 не может прочитать файл mypy.ini, даже если он создан в UTF-8 через PowerShell"
  solution: "Временно отказаться от использования mypy.ini и проверять файлы по отдельности с флагом --ignore-missing-imports. Альтернатива: использовать pytest с плагином mypy или настроить CI на Linux-системе."
  verification: "mypy app/domain/schemas.py app/interfaces.py app/core/config.py app/main.py --ignore-missing-imports завершается успешно"
  assigned_to: "Архитектор"
  tags: ["mypy", "windows", "encoding", "cp1251", "workaround"]

